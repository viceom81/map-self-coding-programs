<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음식 주세요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7EC; --cream-2:#FDEFD8;
    --coral:#FF8A4C; --coral-dark:#F2702C;
    --green:#5BA869; --green-dark:#3F8C4F;
    --brown:#4A3528; --brown-soft:#7A6353;
    --card:#FFFFFF; --line:#F0D9B8; --shadow:rgba(120,80,40,.18);
    --gold:#F7B500;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
    background:radial-gradient(120% 90% at 50% -10%, var(--cream-2), var(--cream) 60%);
    color:var(--brown); height:100vh;
  }
  .app{
    height:100vh; max-width:1700px; margin:0 auto;
    padding:clamp(12px,2vh,26px) clamp(16px,2.4vw,40px);
    display:flex; flex-direction:column; gap:clamp(8px,1.6vh,18px);
  }

  /* ===== 헤더 (탭 + 제목) ===== */
  .header{display:flex;align-items:center;justify-content:space-between;flex:none;}
  .tabs{display:flex;gap:10px;}
  .tab{
    font-family:inherit;border:3px solid var(--line);background:var(--card);
    color:var(--brown-soft);cursor:pointer;border-radius:18px;
    font-size:clamp(18px,2.1vmin,30px);padding:.5em 1em;transition:.12s;
    box-shadow:0 4px 0 var(--line);
  }
  .tab.active{background:var(--coral);color:#fff;border-color:var(--coral-dark);box-shadow:0 4px 0 var(--coral-dark);}
  .tab:focus-visible{outline:4px solid var(--brown);outline-offset:3px;}
  .title{display:flex;align-items:center;gap:10px;font-size:clamp(22px,2.6vmin,38px);}

  /* ===== 본문 가로 2단 ===== */
  .main{flex:1;display:flex;gap:clamp(14px,2vw,34px);min-height:0;}

  /* 왼쪽: 받는 사람 */
  .left{
    flex:0 0 30%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,18px);
    background:var(--card);border:3px solid var(--line);border-radius:28px;
    box-shadow:0 8px 0 var(--line),0 14px 30px var(--shadow);padding:clamp(12px,2vh,24px);min-width:0;
  }
  .bubble{
    background:var(--green);color:#fff;font-size:clamp(20px,2.6vmin,34px);
    padding:.45em 1em;border-radius:20px;text-align:center;position:relative;
    box-shadow:0 4px 0 var(--green-dark);max-width:96%;line-height:1.25;
  }
  .bubble::after{content:"";position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
    border:8px solid transparent;border-top-color:var(--green);}
  .friend-wrap{position:relative;width:clamp(150px,22vmin,300px);height:clamp(150px,22vmin,300px);}
  .friend{width:100%;height:100%;display:block;}
  .served{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%) scale(.2);
    width:46%;height:46%;border-radius:16px;object-fit:cover;border:3px solid #fff;
    box-shadow:0 6px 14px var(--shadow);opacity:0;transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .3s;}
  .left.done .served{opacity:1;transform:translateX(-50%) scale(1);}

  /* 오른쪽: 활동 */
  .right{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(8px,1.6vh,18px);min-width:0;}

  .sentence{display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.4vw,22px);flex:none;}
  .slot{
    background:var(--card);border:3px dashed var(--line);border-radius:22px;
    height:clamp(96px,17vh,210px);aspect-ratio:1/1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    color:var(--brown-soft);font-size:clamp(18px,2.2vmin,28px);transition:.18s;padding:6px;
  }
  .slot.food.filled{border-style:solid;border-color:var(--coral);}
  .slot.food img{height:62%;aspect-ratio:1/1;border-radius:14px;object-fit:cover;}
  .slot.food .label{font-size:clamp(15px,1.9vmin,24px);color:var(--brown);}
  .slot.please.filled{border-style:solid;border-color:var(--green);background:var(--green);color:#fff;font-size:clamp(26px,3.4vmin,46px);}
  .slot .ph{font-size:clamp(34px,4.6vmin,60px);opacity:.45;}
  .slot.wrong{animation:shake .4s;border-color:#E2574C;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-9px);}40%,80%{transform:translateX(9px);}}
  .plus{font-size:clamp(26px,3vmin,42px);color:var(--coral-dark);}
  .listen{
    border:none;cursor:pointer;background:var(--cream-2);color:var(--brown);font-family:inherit;
    font-size:clamp(18px,2.2vmin,30px);padding:.55em 1em;border-radius:18px;box-shadow:0 4px 0 var(--line);
    display:inline-flex;gap:8px;align-items:center;transition:.12s;white-space:nowrap;
  }
  .listen:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
  .listen:disabled{opacity:.4;cursor:default;}

  .hint{text-align:center;font-family:'Gaegu','Jua',sans-serif;font-weight:700;
    font-size:clamp(20px,2.6vmin,34px);color:var(--green-dark);min-height:1.3em;flex:none;}

  /* 음식 + 주세요 */
  .picker{flex:1;display:flex;gap:clamp(10px,1.2vw,20px);min-height:0;align-items:stretch;}
  .foods{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1vw,18px);min-width:0;}
  .food-card{
    background:var(--card);border:3px solid var(--line);border-radius:22px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:clamp(6px,1vh,12px);box-shadow:0 6px 0 var(--line);transition:transform .12s,box-shadow .12s,border-color .12s;
    font-family:inherit;color:var(--brown);min-height:0;
  }
  .food-card img{width:auto;height:70%;max-width:92%;aspect-ratio:1/1;border-radius:14px;object-fit:cover;}
  .food-card .name{font-size:clamp(15px,2vmin,26px);}
  .food-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line);}
  .food-card.chosen{border-color:var(--coral);box-shadow:0 6px 0 var(--coral-dark);background:#FFF1E6;}
  .food-card:focus-visible{outline:4px solid var(--coral);outline-offset:3px;}

  .please-btn{
    flex:0 0 clamp(120px,16%,220px);border:none;cursor:pointer;font-family:inherit;color:#fff;
    background:var(--coral);font-size:clamp(26px,3.6vmin,48px);letter-spacing:2px;border-radius:24px;
    box-shadow:0 7px 0 var(--coral-dark);transition:.12s;
    writing-mode:horizontal-tb;
  }
  .please-btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--coral-dark);}
  .please-btn.chosen{background:var(--green);box-shadow:0 7px 0 var(--green-dark);}
  .please-btn:focus-visible{outline:4px solid var(--brown);outline-offset:3px;}

  /* 푸터 */
  .footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:clamp(44px,7vh,72px);}
  .stars{display:flex;gap:6px;font-size:clamp(24px,3vmin,40px);color:#E4D2B5;}
  .stars .on{color:var(--gold);}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-size:clamp(18px,2.3vmin,32px);
    padding:.5em 1.1em;border-radius:18px;display:inline-flex;gap:8px;align-items:center;transition:.12s;
  }
  .reset{background:transparent;color:var(--brown-soft);border:3px solid var(--line);}
  .reset:active{transform:translateY(3px);}
  .next{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-dark);}
  .next:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-dark);}
  .next[hidden]{display:none;}
  .app.done.s1 .reset{background:var(--coral);color:#fff;border-color:var(--coral-dark);box-shadow:0 5px 0 var(--coral-dark);animation:nudge 1.1s ease-in-out infinite;}
  @keyframes nudge{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}

  .hide{display:none!important;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
  <div class="app s1" id="app">

    <div class="header">
      <div class="tabs">
        <button class="tab active" id="tab1">1단계 · 만들기</button>
        <button class="tab" id="tab2">2단계 · 듣고 맞히기</button>
      </div>
      <div class="title"><span>🍽️</span><span id="titleTxt">음식 주세요</span></div>
    </div>

    <div class="main">
      <!-- 받는 사람 -->
      <div class="left" id="stage">
        <div class="bubble" id="bubble">무엇을 줄까?</div>
        <div class="friend-wrap">
          <svg class="friend" id="friendSvg" viewBox="0 0 170 170" aria-hidden="true">
            <ellipse cx="85" cy="34" rx="40" ry="24" fill="#fff" stroke="#E9D9C4" stroke-width="2"/>
            <circle cx="58" cy="30" r="16" fill="#fff" stroke="#E9D9C4" stroke-width="2"/>
            <circle cx="112" cy="30" r="16" fill="#fff" stroke="#E9D9C4" stroke-width="2"/>
            <rect x="52" y="44" width="66" height="14" rx="7" fill="#FDEFD8" stroke="#E9D9C4" stroke-width="2"/>
            <circle cx="85" cy="100" r="48" fill="#FFE2C2" stroke="#F0C79B" stroke-width="3"/>
            <circle cx="62" cy="116" r="9" fill="#FFC2C2"/>
            <circle cx="108" cy="116" r="9" fill="#FFC2C2"/>
            <circle id="eyeL" cx="68" cy="96" r="6.5" fill="#4A3528"/>
            <circle id="eyeR" cx="102" cy="96" r="6.5" fill="#4A3528"/>
            <path id="mouth" d="M70 118 Q85 130 100 118" fill="none" stroke="#4A3528" stroke-width="5" stroke-linecap="round"/>
          </svg>
          <img class="served" id="served" alt="">
        </div>
      </div>

      <!-- 활동 -->
      <div class="right">
        <div class="sentence">
          <div class="slot food" id="foodSlot"><span class="ph">?</span></div>
          <span class="plus">＋</span>
          <div class="slot please" id="pleaseSlot"><span class="ph">?</span></div>
          <button class="listen" id="listenBtn" disabled>🔊 들려주기</button>
        </div>

        <div class="hint" id="hint"></div>

        <div class="picker">
          <div class="foods" id="foods"></div>
          <button class="please-btn" id="pleaseBtn">주세요</button>
        </div>

        <div class="footer">
          <div class="stars" id="stars"></div>
          <button class="btn reset" id="resetBtn">↺ 다시하기</button>
          <button class="btn next" id="nextBtn" hidden>다음 ▶</button>
        </div>
      </div>
    </div>
  </div>

  ];
  const STAR_GOAL = 5;

  let mode = 1;            // 1=만들기, 2=퀴즈
  let chosenFood = null;
  let saidPlease = false;
  let locked = false;      // 정답/완성 후 잠금
  let target = null;       // 2단계 정답
  let stars = 0;

  // ---- 음성 ----
  let koVoice = null;
  function loadVoices(){
    const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    koVoice = vs.find(v => (v.lang||'').toLowerCase().startsWith('ko')) || null;
  }
  if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function speak(text){
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; if(koVoice) u.voice=koVoice; u.rate=0.82; u.pitch=1.05;
    speechSynthesis.speak(u);
  }

  // ---- 엘리먼트 ----
  const $ = id => document.getElementById(id);
  const app=$('app'), foodsEl=$('foods'), foodSlot=$('foodSlot'), pleaseSlot=$('pleaseSlot'),
        pleaseBtn=$('pleaseBtn'), listenBtn=$('listenBtn'), resetBtn=$('resetBtn'), nextBtn=$('nextBtn'),
        bubble=$('bubble'), hint=$('hint'), stage=$('stage'), served=$('served'),
        mouth=$('mouth'), eyeL=$('eyeL'), eyeR=$('eyeR'), starsEl=$('stars'),
        tab1=$('tab1'), tab2=$('tab2'), titleTxt=$('titleTxt');

  // 음식 카드
  FOODS.forEach(f=>{
    const b=document.createElement('button');
    b.className='food-card'; b.dataset.key=f.key;
    b.innerHTML=`<img src="${f.img}" alt="${f.name}"><span class="name">${f.name}</span>`;
    b.addEventListener('click',()=>pickFood(f));
    foodsEl.appendChild(b);
  });

  function happy(on){
    if(on){ mouth.setAttribute('d','M64 116 Q85 140 106 116'); eyeL.setAttribute('r','5'); eyeR.setAttribute('r','5'); }
    else  { mouth.setAttribute('d','M70 118 Q85 130 100 118'); eyeL.setAttribute('r','6.5'); eyeR.setAttribute('r','6.5'); }
  }
  function setFoodSlot(f){
    foodSlot.classList.add('filled');
    foodSlot.innerHTML=`<img src="${f.img}" alt="${f.name}"><span class="label">${f.name}</span>`;
  }
  function clearSlots(){
    foodSlot.className='slot food'; foodSlot.innerHTML='<span class="ph">?</span>';
    pleaseSlot.className='slot please'; pleaseSlot.innerHTML='<span class="ph">?</span>';
    pleaseBtn.classList.remove('chosen');
    document.querySelectorAll('.food-card').forEach(c=>c.classList.remove('chosen'));
  }
  function drawStars(){
    starsEl.innerHTML='';
    for(let i=0;i<STAR_GOAL;i++){
      const s=document.createElement('span'); s.textContent='★'; if(i<stars)s.className='on'; starsEl.appendChild(s);
    }
  }

  // ---- 선택 ----
  function pickFood(f){
    if(locked) return;
    chosenFood=f; setFoodSlot(f);
    document.querySelectorAll('.food-card').forEach(c=>c.classList.toggle('chosen',c.dataset.key===f.key));
    if(mode===1) bubble.textContent = '“주세요”도 골라요';
    afterPick();
  }
  function pickPlease(){
    if(locked) return;
    saidPlease=true; pleaseSlot.classList.add('filled'); pleaseSlot.innerHTML='주세요'; pleaseBtn.classList.add('chosen');
    afterPick();
  }
  function afterPick(){
    listenBtn.disabled = !( (mode===1&&chosenFood) || mode===2 );
    if(chosenFood && saidPlease){ mode===1 ? complete1() : check2(); }
  }

  // ---- 1단계: 만들기 ----
  function complete1(){
    locked=true; app.classList.add('done');
    const s=`${chosenFood.name} 주세요`;
    bubble.textContent='여기 있어! 🎉'; bubble.style.background='var(--coral)'; bubble.style.boxShadow='0 4px 0 var(--coral-dark)';
    served.src=chosenFood.img; stage.classList.add('done'); happy(true);
    hint.textContent=`🗣️ 따라 말해요 · “${s}”`;
    speak(s);
  }

  // ---- 2단계: 듣고 맞히기 ----
  function newQuestion(){
    locked=false; clearSlots(); chosenFood=null; saidPlease=false;
    app.classList.remove('done'); stage.classList.remove('done'); served.src=''; happy(false);
    bubble.style.background=''; bubble.style.boxShadow=''; nextBtn.hidden=true;
    const others = FOODS.filter(f=>!target||f.key!==target.key);
    target = others[Math.floor(Math.random()*others.length)];
    bubble.textContent='잘 들어요! 🔊';
    hint.textContent='🔊 듣고, 음식과 “주세요”를 골라요';
    listenBtn.disabled=false;
    setTimeout(()=>speak(`${target.name} 주세요`),400);
  }
  function check2(){
    const s=`${target.name} 주세요`;
    if(chosenFood.key===target.key){
      locked=true; app.classList.add('done'); stage.classList.add('done'); served.src=chosenFood.img;
      happy(true); bubble.textContent='딩동댕! 🎉'; bubble.style.background='var(--coral)'; bubble.style.boxShadow='0 4px 0 var(--coral-dark)';
      hint.textContent=`참 잘했어요! · “${s}”`;
      speak(s);
      stars=Math.min(STAR_GOAL,stars+1); drawStars();
      if(stars>=STAR_GOAL){
        hint.textContent='별을 다 모았어요! 🌟';
        setTimeout(()=>{stars=0;drawStars();},1600);
      }
      nextBtn.hidden=false;
    }else{
      // 오답: 다시 듣고 다시 시도 (같은 문제)
      foodSlot.classList.add('wrong');
      bubble.textContent='다시 들어볼까? 🔊';
      hint.textContent='괜찮아요, 한 번 더 들어요';
      setTimeout(()=>{ clearSlots(); chosenFood=null; saidPlease=false; speak(s); },600);
    }
  }

  // ---- 모드 전환 ----
  function setMode(n){
    mode=n; locked=false; chosenFood=null; saidPlease=false; target=null; stars=0;
    clearSlots(); served.src=''; happy(false);
    app.classList.remove('done'); stage.classList.remove('done');
    bubble.style.background=''; bubble.style.boxShadow=''; nextBtn.hidden=true; listenBtn.disabled=true;
    if(window.speechSynthesis) speechSynthesis.cancel();
    tab1.classList.toggle('active',n===1); tab2.classList.toggle('active',n===2);
    app.classList.toggle('s1',n===1);
    if(n===1){
      titleTxt.textContent='음식 주세요';
      listenBtn.textContent='🔊 들려주기';
      bubble.textContent='무엇을 줄까?'; hint.textContent=''; starsEl.classList.add('hide');
      drawStars();
    }else{
      titleTxt.textContent='듣고 맞히기';
      listenBtn.textContent='🔊 다시 듣기';
      starsEl.classList.remove('hide'); drawStars();
      newQuestion();
    }
  }

  // ---- 이벤트 ----
  pleaseBtn.addEventListener('click',pickPlease);
  listenBtn.addEventListener('click',()=>{
    if(mode===1){ if(chosenFood) speak(saidPlease?`${chosenFood.name} 주세요`:chosenFood.name); }
    else if(target){ speak(`${target.name} 주세요`); }
  });
  resetBtn.addEventListener('click',()=>{ mode===1 ? setMode(1) : newQuestion(); });
  nextBtn.addEventListener('click',newQuestion);
  tab1.addEventListener('click',()=>setMode(1));
  tab2.addEventListener('click',()=>setMode(2));

  setMode(1);
</script>
