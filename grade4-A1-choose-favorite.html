<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내가 좋아하는 것 고르기</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --accent: #10B981;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #1E293B;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      width: 100%;
      max-width: 960px;
      text-align: center;
      margin-bottom: 16px;
    }
    .progress-bar-container {
      width: 100%;
      height: 16px;
      background: #E2E8F0;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar {
      height: 100%;
      width: 14.2%;
      background: linear-gradient(90deg, #6366F1, #4F46E5);
      transition: width 0.3s ease;
    }
    .title {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 12px 0 6px 0;
    }
    .subtitle {
      font-size: 1.25rem;
      color: #64748B;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 960px;
      flex: 1;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    .card {
      background: var(--card-bg);
      border: 3.5px solid #E2E8F0;
      border-radius: 24px;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06);
      transition: all 0.15s ease;
      touch-action: manipulation;
      min-height: 160px;
    }
    .card:active { transform: scale(0.96); }
    .card.selected {
      border-color: var(--primary);
      background-color: var(--primary-light);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.25);
    }
    .card-icon-wrapper {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .card-icon-wrapper svg {
      width: 100%;
      height: 100%;
    }
    .card-label {
      font-size: 1.45rem;
      font-weight: 800;
      color: #1E293B;
      margin-top: 4px;
    }
    .footer {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      gap: 16px;
    }
    .btn {
      padding: 18px 40px;
      font-size: 1.6rem;
      font-weight: 800;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.2s;
    }
    .btn-prev {
      background: #E2E8F0;
      color: #475569;
    }
    .btn-next {
      background: var(--primary);
      color: white;
      flex: 1;
      box-shadow: 0 6px 12px rgba(79, 70, 229, 0.25);
    }
    .btn-next:disabled {
      background: #CBD5E1;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }
    /* 최종 요약 화면 */
    .summary-container {
      width: 100%;
      max-width: 960px;
      background: white;
      border-radius: 28px;
      padding: 36px 30px;
      box-shadow: 0 10px 20px -3px rgba(0,0,0,0.08);
    }
    .summary-row {
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 2px dashed #E2E8F0;
    }
    .summary-row:last-child {
      border-bottom: none;
    }
    .summary-cat-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .summary-items {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .summary-chip {
      background: var(--primary-light);
      border: 2px solid var(--primary);
      border-radius: 16px;
      padding: 8px 16px;
      font-size: 1.25rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .summary-chip svg {
      width: 30px;
      height: 30px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="progress-bar-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <h1 id="categoryTitle" class="title">과일</h1>
    <div id="instruction" class="subtitle">좋아하는 것을 터치해서 골라보세요! (여러 개 선택 가능)</div>
  </div>

  <div id="cardGrid" class="grid"></div>

  <!-- 최종 화면 -->
  <div id="summaryView" class="summary-container" style="display: none;">
    <h2 style="text-align: center; font-size: 2.2rem; margin-top: 0; color: #1E293B;">🎉 내가 좋아하는 것 모음판</h2>
    <div id="summaryContent"></div>
    <div style="text-align: center; margin-top: 32px;">
      <button class="btn btn-next" onclick="restart()">처음부터 다시하기 🔄</button>
    </div>
  </div>

  <!-- 네비게이션 버튼 -->
  <div id="footerControls" class="footer">
    <button id="prevBtn" class="btn btn-prev" onclick="prevStep()">이전</button>
    <button id="nextBtn" class="btn btn-next" onclick="nextStep()" disabled>다음 ➔</button>

    const categories = [
      {

        ]

      {
        id: 'activity',
        title: '🏃 활동 & 놀이',
        items: [
          { name: '그네타기', icon: ICONS.swing }, { name: '트램펄린', icon: ICONS.trampoline },
          { name: '퀵보드', icon: ICONS.kickboard }, { name: '공놀이', icon: ICONS.ball },

        ]

      {
        id: 'animal',
        title: '🐾 동물',
        items: [
          { name: '강아지', icon: ICONS.dog }, { name: '고양이', icon: ICONS.cat },
          { name: '코끼리', icon: ICONS.elephant }, { name: '원숭이', icon: ICONS.monkey },

        title: '🎨 색깔',
        items: [
          { name: '빨강', icon: ICONS.red }, { name: '주황', icon: ICONS.orange_c },
          { name: '노랑', icon: ICONS.yellow }, { name: '초록', icon: ICONS.green },
          { name: '파랑', icon: ICONS.blue }, { name: '보라', icon: ICONS.purple },
          { name: '분홍', icon: ICONS.pink }, { name: '검정', icon: ICONS.black }
        ]
      },
      {
        id: 'people',
        title: '👨‍👩‍👧 사람 & 가족',
        items: [
          { name: '가족', icon: ICONS.family }, { name: '친구', icon: ICONS.friends },
          { name: '선생님', icon: ICONS.teacher }, { name: '이모/삼촌', icon: ICONS.aunt },
          { name: '할머니', icon: ICONS.grandma }, { name: '할아버지', icon: ICONS.grandpa }
        ]
      }
    ];

    let currentStep = 0;
    const selections = {};
    categories.forEach(c => selections[c.id] = []);

    function renderCurrentStep() {
      const cat = categories[currentStep];
      document.getElementById('categoryTitle').textContent = cat.title;
      document.getElementById('progressBar').style.width = `${((currentStep + 1) / categories.length) * 100}%`;
      
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      cat.items.forEach(item => {
        const isSelected = selections[cat.id].some(s => s.name === item.name);
        const card = document.createElement('div');
        card.className = `card ${isSelected ? 'selected' : ''}`;
        card.innerHTML = `
          <div class="card-icon-wrapper">${item.icon}</div>
          <div class="card-label">${item.name}</div>
        `;
        card.onclick = () => toggleSelection(cat.id, item);
        grid.appendChild(card);
      });

      document.getElementById('prevBtn').style.display = currentStep === 0 ? 'none' : 'block';
      validateNextButton();
    }

    function toggleSelection(catId, item) {
      const index = selections[catId].findIndex(s => s.name === item.name);
      if (index > -1) {
        selections[catId].splice(index, 1);
      } else {
        selections[catId].push(item);
      }
      renderCurrentStep();
    }

    function validateNextButton() {
      const cat = categories[currentStep];
      const hasSelection = selections[cat.id].length > 0;
      document.getElementById('nextBtn').disabled = !hasSelection;
    }

    function nextStep() {
      if (currentStep < categories.length - 1) {
        currentStep++;
        renderCurrentStep();
      } else {
        showSummary();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderCurrentStep();
      }
    }

    function showSummary() {
      document.getElementById('cardGrid').style.display = 'none';
      document.getElementById('footerControls').style.display = 'none';
      document.getElementById('categoryTitle').style.display = 'none';
      document.getElementById('instruction').style.display = 'none';
      document.getElementById('summaryView').style.display = 'block';

      const summaryContent = document.getElementById('summaryContent');
      summaryContent.innerHTML = '';

      categories.forEach(cat => {
        const row = document.createElement('div');
        row.className = 'summary-row';
        const selectedItems = selections[cat.id];
        
        let chipsHtml = selectedItems.map(item => `
          <span class="summary-chip">${item.icon} <span>${item.name}</span></span>
        `).join('');

        row.innerHTML = `
          <div class="summary-cat-title">${cat.title}</div>
          <div class="summary-items">${chipsHtml}</div>
        `;
        summaryContent.appendChild(row);
      });
    }

    function restart() {
      categories.forEach(c => selections[c.id] = []);
      currentStep = 0;
      document.getElementById('cardGrid').style.display = 'grid';
      document.getElementById('footerControls').style.display = 'flex';
      document.getElementById('categoryTitle').style.display = 'block';
      document.getElementById('instruction').style.display = 'block';
      document.getElementById('summaryView').style.display = 'none';
      renderCurrentStep();
    }

    renderCurrentStep();
  </script>
</body>
